<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recent Work | Rafael Yaluff</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #ffffff;
        color: #000000;
        padding: 40px 20px 80px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 32px;
      }

      .back-link {
        color: #000000;
        text-decoration: none;
        font-size: 0.9rem;
      }

      .lang-switch {
        display: flex;
        gap: 0.25rem;
      }

      .lang-switch button {
        border: 1px solid #000000;
        background: #ffffff;
        color: #000000;
        padding: 6px 14px;
        font-size: 0.85rem;
        letter-spacing: 0.06em;
        cursor: pointer;
      }

      .lang-switch button[aria-pressed="true"] {
        background: #000000;
        color: #ffffff;
      }

      h1 {
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 400;
        letter-spacing: 0.08em;
        margin-bottom: 32px;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 42px;
      }

      .painting {
        display: flex;
        flex-direction: column;
      }

      .painting img {
        width: 100%;
        height: auto;
        display: block;
        background: #f5f5f5;
        cursor: pointer;
      }

      .painting-info {
        margin-top: 16px;
      }

      .painting-info h2 {
        font-size: 1.1rem;
        font-weight: 700;
        margin-bottom: 8px;
        letter-spacing: 0.04em;
      }

      .meta {
        font-size: 0.82rem;
        color: #555555;
        line-height: 1.6;
        margin-bottom: 10px;
      }

      .description {
        font-size: 0.9rem;
        line-height: 1.7;
        color: #222222;
        font-style: italic;
      }

      .lightbox {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.8);
        z-index: 999;
        padding: 32px;
      }

      .lightbox.open {
        display: flex;
      }

      .lightbox-content {
        position: relative;
        max-width: min(90vw, 1200px);
        max-height: 90vh;
      }

      .lightbox-content img {
        display: block;
        max-width: 100%;
        max-height: 90vh;
        width: auto;
        height: auto;
        background: #ffffff;
      }

      .lightbox-close {
        position: absolute;
        top: -16px;
        right: -16px;
        width: 36px;
        height: 36px;
        border: none;
        border-radius: 50%;
        background: #ffffff;
        color: #000000;
        font-size: 1.2rem;
        cursor: pointer;
      }

      @media (max-width: 640px) {
        .gallery {
          grid-template-columns: 1fr;
        }

        .lightbox {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <a class="back-link" id="back-link" href="index.html">← Back</a>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang="en">English</button>
          <button type="button" data-lang="es">Español</button>
          <button type="button" data-lang="de">Deutsch</button>
        </div>
      </div>
      <h1 id="page-title">Recent Work</h1>
      <div id="gallery" class="gallery"></div>
    </div>

    <div id="lightbox" class="lightbox" aria-hidden="true">
      <div class="lightbox-content">
        <button class="lightbox-close" aria-label="Close image">×</button>
        <img id="lightbox-image" src="" alt="Expanded painting view" />
      </div>
    </div>

    <script>
      const text = {
        en: { back: '← Back', title: 'Recent Work', error: 'Unable to load paintings.', alt: 'Recent work artwork' },
        es: { back: '← Volver', title: 'Pintura Reciente', error: 'No se pudieron cargar las pinturas.', alt: 'Obra reciente' },
        de: { back: '← Zurück', title: 'Aktuelle Werke', error: 'Die Gemälde konnten nicht geladen werden.', alt: 'Aktuelles Kunstwerk' }
      };
      const supported = ['en', 'es', 'de'];
      let lang = 'en';
      try {
        const saved = localStorage.getItem('archive-lang');
        if (supported.includes(saved)) lang = saved;
      } catch (e) {}

      // Fields may be a plain string or an object like { en, es, de }; fall back to English.
      const pick = (value) => {
        if (value && typeof value === 'object') return value[lang] || value.en || '';
        return value || '';
      };

      const gallery = document.getElementById('gallery');
      const lightbox = document.getElementById('lightbox');
      const lightboxImage = document.getElementById('lightbox-image');
      const closeButton = document.querySelector('.lightbox-close');
      let paintings = [];
      let failed = false;

      function closeLightbox() {
        lightbox.classList.remove('open');
        lightbox.setAttribute('aria-hidden', 'true');
        lightboxImage.src = '';
      }

      function render() {
        document.documentElement.lang = lang;
        document.getElementById('back-link').textContent = text[lang].back;
        document.getElementById('page-title').textContent = text[lang].title;
        document.title = text[lang].title + ' | Rafael Yaluff';
        document.querySelectorAll('.lang-switch button').forEach(button => {
          button.setAttribute('aria-pressed', String(button.dataset.lang === lang));
        });

        gallery.innerHTML = '';
        if (failed) {
          gallery.innerHTML = `<p>${text[lang].error}</p>`;
          return;
        }

        paintings.forEach((painting) => {
          const title = pick(painting.title);
          const description = pick(painting.description).trim();
          const meta = [pick(painting.year), pick(painting.medium)].filter(Boolean).join(' | ');
          const dimensions = pick(painting.dimensions);

          const card = document.createElement('article');
          card.className = 'painting';
          card.innerHTML = `
            <img src="${painting.image}" alt="${title || text[lang].alt}" />
            ${title || meta || dimensions || description ? `
              <div class="painting-info">
                ${title ? `<h2>${title}</h2>` : ''}
                ${meta || dimensions ? `<div class="meta">${meta}${meta && dimensions ? '<br>' : ''}${dimensions}</div>` : ''}
                ${description ? `<div class="description">${description}</div>` : ''}
              </div>
            ` : ''}
          `;

          card.querySelector('img').addEventListener('click', () => {
            lightboxImage.src = painting.image;
            lightboxImage.alt = title || text[lang].alt;
            lightbox.classList.add('open');
            lightbox.setAttribute('aria-hidden', 'false');
          });

          gallery.appendChild(card);
        });
      }

      document.querySelectorAll('.lang-switch button').forEach(button => {
        button.addEventListener('click', () => {
          lang = button.dataset.lang;
          try { localStorage.setItem('archive-lang', lang); } catch (e) {}
          closeLightbox();
          render();
        });
      });

      closeButton.addEventListener('click', closeLightbox);

      lightbox.addEventListener('click', (event) => {
        if (event.target === lightbox) closeLightbox();
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
      });

      fetch('recent-work.json')
        .then(res => res.json())
        .then(data => { paintings = data.paintings; })
        .catch(() => { failed = true; })
        .finally(render);
    </script>
  </body>
</html>
